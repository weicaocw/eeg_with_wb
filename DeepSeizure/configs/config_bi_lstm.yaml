data:
  # 训练数据根目录
  train_root_dir: "/home/students/wcao/eeg_train_seizure_h5" 
  # 训练集标注
  train_annotation: "/home/students/wcao/eeg_with_wb/DeepSeizure/data/raw/train_segments.json"
  
  # 测试数据根目录 (可以是同一个，也可以不同)
  test_root_dir: "/home/students/wcao/eeg_test_seizure_h5"
  # 测试集标注
  test_annotation: "/home/students/wcao/eeg_with_wb/DeepSeizure/data/raw/eval_segments.json"
  
  fs: 250
  tmp_dir: "/tmp" # 统一配置临时目录

features:
  n_fft: 128            
  mi_bins: 32           
  use_coherence: true   
  use_mi: true          
  bispectrum:
    enabled: true
    include_raw: true
    include_normalized: true
    reduce_to_bands: true   
    batch_size: -1 
  frequency_bands:
    Delta: [0.5, 4]
    Theta: [4, 8]
    Alpha: [8, 13]
    Beta: [13, 30]
    Gamma: [30, 100]

train:
  model_type: "lstm" # lstm, transformer, mamba
  batch_size: 32
  epochs: 20
  learning_rate: 0.0001
  seq_len: 10
  
  # --- 新增：监控配置 ---
  log_dir: "/home/students/wcao/eeg_with_wb/DeepSeizure/runs" # TensorBoard 日志存放位置
  